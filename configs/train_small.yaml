# Small, laptop-friendly training config: CPU/MPS-safe patch size and
# model width. Use this for local development, smoke tests, and quick
# iteration. See configs/train_gpu.yaml for a larger configuration meant
# for a real GPU training run on the full Multimodal-HC liver task.

manifest_path: outputs/curation/data_manifest.csv
output_dir: outputs/training/small
experiment_name: liver_segmentation_small

patch_size: [64, 64, 64]
batch_size: 1
num_workers: 0

channels: [16, 32, 64, 128]
strides: [2, 2, 2]
num_res_units: 2

learning_rate: 0.0001
weight_decay: 0.00001
num_epochs: 20
val_interval: 1
early_stopping_patience: 8

device: auto
amp: true
seed: 42
