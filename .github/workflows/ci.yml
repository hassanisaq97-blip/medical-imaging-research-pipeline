name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0
      MEDIMG_LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Unit tests (fast suite)
        run: pytest tests/ -v -m "not slow"

      - name: Tiny model smoke test (synthetic data only, not the real Multimodal-HC model)
        run: pytest tests/ -v -m "slow"
