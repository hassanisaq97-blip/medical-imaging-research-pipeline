[project]
name = "medimg-pipeline"
version = "0.1.0"
description = "Reproducible medical-imaging research infrastructure: DICOM de-identification, data curation, MONAI/PyTorch 3D segmentation, inference, and a job-queue API."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "scipy>=1.11",
    "nibabel>=5.2",
    "pydicom>=2.4",
    "dicom2nifti>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "torch>=2.2",
    "monai>=1.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "rq>=1.16",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "httpx>=0.27",
]

[project.scripts]
medimg-pipeline = "medimg_pipeline.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end smoke tests (tiny synthetic training run); excluded from the fast CI suite.",
]
